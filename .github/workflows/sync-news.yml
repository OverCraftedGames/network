# Mirrors the Discord announcements channel into news/posts.json (see scripts/sync-news.mjs).
# Needs two repository secrets: DISCORD_BOT_TOKEN and DISCORD_NEWS_CHANNEL_ID.
# A commit from this job redeploys GitHub Pages, so new posts show up within ~20 minutes.
name: Sync news from Discord

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-news
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch announcements
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_NEWS_CHANNEL_ID: ${{ secrets.DISCORD_NEWS_CHANNEL_ID }}
        # Until the secrets are added, skip quietly instead of failing every 15 minutes.
        run: |
          if [ -z "$DISCORD_BOT_TOKEN" ] || [ -z "$DISCORD_NEWS_CHANNEL_ID" ]; then
            echo "::notice::DISCORD_BOT_TOKEN / DISCORD_NEWS_CHANNEL_ID not set; skipping sync."
            exit 0
          fi
          node scripts/sync-news.mjs
      - name: Commit changes
        run: |
          if [ -n "$(git status --porcelain news)" ]; then
            git config user.name "news-sync"
            git config user.email "news-sync@users.noreply.github.com"
            git add news
            git commit -m "Sync news from Discord"
            git push
          fi
