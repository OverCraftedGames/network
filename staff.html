<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="assets/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400..700&family=Pixelify+Sans:wght@400..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/site.css?v=7">
  <script src="assets/config.js?v=7"></script>
  <script src="assets/data.js"></script>
  <script defer src="https://js.tebex.io/v/1.js"></script>
  <script defer src="assets/layout.js?v=7"></script>
  <script defer src="assets/store.js?v=7"></script>
  <title>Meet the Staff · OCG Network</title>
  <meta name="description" content="The people who build, run and moderate the OCG Network servers.">
</head>
<body data-page="staff">
  <header id="site-header"></header>

  <main>
    <section class="page-head">
      <div class="wrap">
        <div>
          <p class="label">The team</p>
          <h1>Meet the Staff</h1>
          <p class="lede">The people who build, run and look after the OCG Network servers.</p>
        </div>
      </div>
    </section>

    <div id="staff-groups"></div>

    <section class="wrap section section--end" data-reveal>
      <div class="band surface">
        <div class="band__icon"><svg width="64" height="64"><use href="#i-discord"/></svg></div>
        <div>
          <p class="label">Join the team</p>
          <h2>Want to help out?</h2>
          <p>We're always looking for helpful players. Open a ticket in our Discord to apply for a staff
            or builder role.</p>
        </div>
        <a class="btn btn--discord" data-discord-link href="https://discord.gg/ocg">Open a ticket</a>
      </div>
    </section>
  </main>

  <footer id="site-footer"></footer>
  <script>
    (() => {
      const net = window.NETWORK || {};
      const servers = Object.fromEntries((net.servers || []).map((s) => [s.id, s.name]));
      const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
      const discord = (window.STORE_CONFIG || {}).discord;
      if (discord) document.querySelector("[data-discord-link]").href = discord;

      document.getElementById("staff-groups").innerHTML = (net.staff || []).map((group) => `
        <section class="wrap section" data-reveal>
          <div class="section-head"><div><h2>${esc(group.role)}</h2></div></div>
          <div class="staff-grid">
            ${group.members.map((m) => `
              <article class="staff-card staff-card--${esc(group.key)} surface">
                <img class="staff-card__face" src="https://mc-heads.net/avatar/${encodeURIComponent(m.name)}/64"
                  alt="" width="64" height="64" loading="lazy">
                <div>
                  <h3>${esc(m.name)}</h3>
                  <p class="staff-card__role">${esc(group.title || group.role)}</p>
                  ${m.bio ? `<p class="staff-card__bio">${esc(m.bio)}</p>` : ""}
                  <ul class="staff-card__servers">
                    ${(m.servers || []).map((id) => `<li class="server--${esc(id)}">${esc(servers[id] || id)}</li>`).join("")}
                  </ul>
                </div>
              </article>`).join("")}
          </div>
        </section>`).join("");
    })();
  </script>
</body>
</html>
